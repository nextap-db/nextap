<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexTap Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:24px;margin:16px 0}h1{font-size:44px;letter-spacing:-.04em;margin:0 0 8px}h2{margin-top:0}.muted{color:#667085}input,textarea{width:100%;padding:14px;margin:6px 0;border:1px solid #d8e0eb;border-radius:13px;font:inherit;background:#fbfcfe}input:focus,textarea:focus{outline:3px solid #dce9ff;border-color:#2b66c5}textarea{min-height:100px;resize:vertical}button{background:#080b11;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:700;cursor:pointer}.secondary{background:#fff;color:#111;border:1px solid #d9dee7}.danger{background:#b42318}.row{display:flex;gap:10px;align-items:center}.client{display:flex;gap:14px;align-items:center;border-top:1px solid #e8edf4;padding:16px 0}.client:first-child{border-top:0}.avatar{width:62px;height:62px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#dce8fa,#eef2f8);border:3px solid #fff;box-shadow:0 4px 14px rgba(10,30,70,.12)}.info{flex:1}.error{color:#b42318}.success{color:#067647}.hint{font-size:13px;color:#667085;margin:2px 0 10px}a{color:#102957}.muted{color:#66758b}.hint{font-size:13px;color:#66758b;margin:2px 0 10px}.error{color:#b42318}.success{color:#067647}.row{display:flex;gap:10px;align-items:center}.row button{box-shadow:0 8px 20px rgba(7,20,45,.12)}@media(max-width:650px){h1{font-size:40px}.card{padding:20px}.client{align-items:flex-start}.client .row{margin-left:auto}} </style></head>
<body><section class="wrap"><div><p class="muted">NEXTAP ADMIN</p><h1>Clients</h1></div>
<div class="card"><h2 id="formTitle">Add Client</h2><input id="name" placeholder="Full name"><input id="job" placeholder="Job title"><input id="company" placeholder="Company"><textarea id="about" placeholder="About the client"></textarea><input id="phone" placeholder="Phone number"><input id="email" type="email" placeholder="Email"><input id="instagram" placeholder="Instagram URL or username"><input id="facebook" placeholder="Facebook URL or username"><input id="linkedin" placeholder="LinkedIn URL or username"><input id="messenger" placeholder="Messenger profile URL or username"><input id="whatsapp" placeholder="WhatsApp number"><input id="viber" placeholder="Viber number"><input id="website" placeholder="Website (optional)"><label class="muted">Brand accent color (optional)</label><input id="accent_color" type="color" value="#2162c6" style="height:48px;padding:5px"><p class="hint">Choose a brand color for the profile buttons and accents.</p><label class="muted">Profile photo</label><input id="photo" type="file" accept="image/*"><p class="hint">When editing, leave photo empty to keep the current photo.</p><div class="row"><button id="saveBtn">Save Client</button><button id="clearBtn" class="secondary">Clear</button></div><p id="msg" class="muted"></p></div>
<div class="card"><h2>Client List</h2><div id="list"></div></div></section>
<script>
let editingId=null;const $=id=>document.getElementById(id);$("saveBtn").onclick=saveClient;$("clearBtn").onclick=clearForm;
function slug(s){return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function loadClients(){let r=await fetch("/api/clients"),d=await r.json();if(!r.ok)throw Error(d.error||"Load failed");window.clients=d;$("list").innerHTML=d.length?d.map(c=>`<div class="client">${c.photo_url||c.photo?`<img class="avatar" src="${esc(c.photo_url||c.photo)}" alt="" onerror="this.style.visibility='hidden'">`:`<div class="avatar"></div>`}<div class="info"><b>${esc(c.name)}</b><br><span class="muted">${esc(c.job_title||"")}${c.company?" · "+esc(c.company):""}</span><br><small>Profile: <a href="/profile/${encodeURIComponent(c.slug)}" target="_blank">/profile/${esc(c.slug)}</a></small></div><button onclick="editClient('${esc(c.id)}')">Edit</button><button class="danger" onclick="deleteClient('${esc(c.id)}')">Delete</button></div>`).join(""):'<p class="muted">No clients yet.</p>'}
async function saveClient(){let m=$("msg"),name=$("name").value.trim();if(!name){m.className="muted error";m.textContent="Name is required.";return}m.className="muted";m.textContent="Saving...";try{let p={id:editingId||undefined,name,slug:slug(name),job_title:$("job").value.trim(),company:$("company").value.trim(),about:$("about").value.trim(),phone:$("phone").value.trim(),email:$("email").value.trim(),instagram:$("instagram").value.trim(),facebook:$("facebook").value.trim(),linkedin:$("linkedin").value.trim(),messenger:$("messenger").value.trim(),whatsapp:$("whatsapp").value.trim(),viber:$("viber").value.trim(),website:$("website").value.trim(),accent_color:$("accent_color").value,active:true};let f=$("photo").files[0];if(f){if(!f.type.startsWith("image/"))throw Error("Please choose an image file.");if(f.size>5*1024*1024)throw Error("Photo must be 5 MB or smaller.");let fd=new FormData;fd.append("photo",f);let u=await fetch("/api/upload",{method:"POST",body:fd}),j=await u.json();if(!u.ok)throw Error(j.error||"Photo upload failed");p.photo_url=j.url;p.photo=j.url}let r=await fetch("/api/clients",{method:editingId?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)}),j=await r.json();if(!r.ok)throw Error(j.error||"Save failed");m.className="muted success";m.textContent="Client saved.";clearForm();await loadClients()}catch(e){m.className="muted error";m.textContent=e.message}}
window.editClient=async id=>{let c=(window.clients||[]).find(x=>x.id===id);if(!c)return;editingId=id;$("formTitle").textContent="Edit Client";$("name").value=c.name||"";$("job").value=c.job_title||"";$("company").value=c.company||"";$("about").value=c.about||"";$("phone").value=c.phone||"";$("email").value=c.email||"";$("instagram").value=c.instagram||"";$("facebook").value=c.facebook||"";$("linkedin").value=c.linkedin||"";$("messenger").value=c.messenger||"";$("whatsapp").value=c.whatsapp||"";$("viber").value=c.viber||"";$("website").value=c.website||"";$("accent_color").value=c.accent_color||"#2162c6";$("photo").value="";scrollTo({top:0,behavior:"smooth"})}
window.deleteClient=async id=>{if(!confirm("Delete this client?"))return;let r=await fetch("/api/clients/"+encodeURIComponent(id),{method:"DELETE"});if(!r.ok){let j=await r.json();$("msg").className="muted error";$("msg").textContent=j.error||"Delete failed";return}loadClients()}
function clearForm(){editingId=null;$("formTitle").textContent="Add Client";$("photo").value="";$("accent_color").value="#2162c6";["name","job","company","about","phone","email","instagram","facebook","linkedin","messenger","whatsapp","viber","website"].forEach(id=>$(id).value="")}
loadClients().catch(e=>$("list").innerHTML='<p class="error">'+esc(e.message)+'</p>');
</script></body></html>
