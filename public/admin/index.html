<!--
==================================================================
NEXTAP ADMIN PATCH
PART A: small edits in the existing file (find -> replace)
PART B: delete the old tail scripts and paste the block at the bottom
==================================================================

A1. DRAWER FOOTER (HTML). Wrap the two buttons:
    FIND:    </nav><button class="nx-admin-public"
    REPLACE: </nav><div class="nx-admin-footer"><button class="nx-admin-public"
    (the existing </div></aside> after "Log out" then closes the footer)

A2. editClient(): DELETE this line (function does not exist, it crashed Edit):
    updateProfileTypeAccess();

A3. saveClient(): right after the `if(!r.ok){ throw Error(...) }` block add
    if(!editingId && j.id){ editingId = j.id; $("formTitle").textContent = "Edit Client"; }

A4. saveClient(): keep the slug on rename (NFC/QR links keep working)
    FIND:    slug:\n        slug(name),
    REPLACE: slug: editingId ? ((window.clients||[]).find(x=>x.id===editingId)?.slug || slug(name)) : slug(name),

A5. saveClient(): last line of the try block
    FIND:    setAdminSection("profile",true);   (the one after setEditorContext(true, saved || {name}))
    REPLACE: setAdminSection(activeAdminSection,true);

A6. Twitch + Steam (backend must accept these two fields):
    saveClient payload, after dribbble:  twitch:$("twitch").value.trim(), steam:$("steam").value.trim(),
    editClient, after dribbble:          $("twitch").value=c.twitch||""; $("steam").value=c.steam||"";
    clearForm id list, after "dribbble": "twitch","steam",

A7. Client search (inverted):
    FIND:    client.style.display = text.includes(term) ? "" : "flex";
    REPLACE: client.style.display = text.includes(term) ? "" : "none";

A8. setAdminSection(): Security gets a Save bar and a title
    FIND:    ["profile","cardtype","contact","links","appearance","featured","quickinfo","businesshours"]
    REPLACE: ["profile","cardtype","contact","links","appearance","featured","quickinfo","businesshours","security"]
    FIND:    if(pageTitle) pageTitle.textContent = meta?.dataset.title || "NexTap Admin";
    REPLACE: const SEC = {security:["Security","Client login password and profile status."]}[activeAdminSection];
             if(pageTitle) pageTitle.textContent = meta?.dataset.title || SEC?.[0] || "NexTap Admin";
    FIND:    if(pageSubtitle) pageSubtitle.textContent = meta?.dataset.subtitle || "";
    REPLACE: if(pageSubtitle) pageSubtitle.textContent = meta?.dataset.subtitle || SEC?.[1] || "";

PART B: DELETE everything from the script that starts with
    "const PROFILE_CONTENT_MAP" through the end of the file
    (categories, polish, builders 1 and 2, specialized modules, card tier
    script, and the trailing <style>), then paste the block below just
    before </body>.
-->

<style>
/* ---- light-theme leftovers (were dark text on dark) ---- */
.login-box h1{color:#fff}
.card-type-label,.card-tier-option>span{background:#fff;border-color:#dce3ec;color:#182131}
.card-type-label:hover,.card-tier-option:hover>span{background:#f8fbff;border-color:#9fc0ef}
.card-type-option input:checked+.card-type-label,.card-tier-option input:checked+span{background:#eef4ff;border-color:var(--blue)}
.card-type-label span,.card-tier-option small{color:#748092}
.card-tier-panel{margin:14px 0;padding:16px;border:1px solid #e3e8ef;border-radius:15px;background:#f8fafc}
.card-tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.card-tier-option{position:relative;cursor:pointer}
.card-tier-option input{position:absolute;opacity:0;pointer-events:none}
.card-tier-option>span{display:block;min-height:96px;padding:14px;border:1px solid #dce3ec;border-radius:14px}
.card-tier-option b{display:block;font-size:14px}
.card-tier-option small{display:block;font-size:11px;line-height:1.45;margin-top:7px}
.tier-help{background:#f2f7ff;border-color:#d6e4f7;color:#526273}
.card-type-grid[hidden],.tier-help[hidden]{display:none}
.content-builder{background:#f8fafc;border-color:#e3e8ef}
.content-builder-row input,.content-builder-remove{background:#fff;border-color:#dce3ec}
.hours-header{background:#f1f4f8}.hours-row{border-color:#e5eaf1}
.qi-tag{background:#eef4ff;color:#1f3a63;border-color:#d6e4f7}
.qi-icon{background:#f1f4f8;border-color:#dfe6ee}
@media(max-width:650px){.card-tier-grid{grid-template-columns:1fr}}

/* ---- module padding (modules have no .module-fields wrapper) ---- */
.qi-module{padding:0 0 16px!important}
.qi-module>:not(.module-head){width:calc(100% - 32px);margin-left:16px;margin-right:16px}
.qi-module>.hint{margin-top:12px}

/* ---- preview panel no longer covers the editor ---- */
@media(min-width:1051px){.workspace:not(.preview-closed) .editor{width:auto;margin:0 calc(min(520px,48vw) + 24px) 0 5vw}}
@media(max-width:1050px){.preview-panel{position:static;width:auto;box-shadow:none}.workspace{display:block}}

/* ---- Content: Recommended / Other ---- */
.nx-cg .qi-category-icon{display:grid!important;margin-top:0!important}
.qi-category[hidden],.qi-module[hidden],.module[data-profile-types][hidden]{display:none!important}
.module[data-profile-types].qi-search-hidden{display:none!important}
.qi-turn{padding:6px 10px;border:1px solid #dce3ec;border-radius:9px;background:#fff;color:#c2410c;font-size:11px;font-weight:800;margin-right:10px;white-space:nowrap}
.qi-module.is-off .qi-turn,.module[data-profile-types].is-off .qi-turn{color:#1769ee}
.qi-module.is-off,.module[data-profile-types].is-off{opacity:.72}
</style>

<script>
(function(){
const $=id=>document.getElementById(id);
const L=s=>s.split(" ");
const MAP={
 corporate_professional:L("location business_hours services portfolio booking reviews payments education skills resume achievements certifications pricing team multiple_locations business_inquiry gallery custom_links collaborations"),
 businessman:L("location business_hours services portfolio booking reviews payments pricing products promotions team multiple_locations business_inquiry education skills resume achievements certifications gallery custom_links collaborations"),
 student:L("education skills resume achievements certifications portfolio location services booking business_inquiry gallery interests custom_links collaborations"),
 e_sport:L("games tournament_history streaming discord gallery media custom_links collaborations interests location booking reviews payments business_inquiry skills achievements certifications portfolio"),
 content_creator:L("media gallery streaming portfolio collaborations custom_links interests services booking reviews payments pricing promotions business_inquiry location business_hours education skills resume achievements certifications"),
 personal:L("location education skills resume achievements certifications portfolio interests gallery custom_links collaborations business_inquiry reviews services booking")
};
const NAMES={corporate_professional:"Corporate / Professional",businessman:"Businessman",student:"Student",e_sport:"E-Sport",content_creator:"Content Creator",personal:"Personal"};
/* Tier per module: 1 Basic, 2 Premium, 3 Elite. Default 2. Change here to move a module between tiers. */
const TIER={location:1,education:1,skills:1,business_inquiry:1,reviews:3,payments:3,products:3,promotions:3,team:3,multiple_locations:3};
const RANK={basic:1,premium:2,gold:3};
const T=k=>TIER[k]||2;
const tier=()=>RANK[String(legacyCardTypeForSave||"gold").toLowerCase()]||3;
const type=()=>document.querySelector('input[name="card_type"]:checked')?.value||"corporate_professional";
const card=()=>$("quickInfoCard");
const mods=()=>card()?[...card().querySelectorAll(".qi-module[data-quick-module],.module[data-profile-types]")]:[];
const keyOf=m=>m.dataset.quickModule||m.querySelector('textarea[id^="profile_module_"]')?.id.slice(15);
const sw=m=>m.querySelector(".module-head input[type=checkbox]");
const rec=t=>new Set(MAP[t]||[]);
const dirty=()=>{if(typeof setDirty==="function")setDirty(true);};
let lastType=null;

/* ---------- Card tier picker ---------- */
function setTier(t){
 t=RANK[String(t||"").toLowerCase()]?String(t).toLowerCase():"gold";
 legacyCardTypeForSave=t;
 const r=document.querySelector('input[name="card_tier"][value="'+t+'"]');if(r)r.checked=true;
}
function tierUI(){
 const c=document.querySelector('[data-admin-section="cardtype"]');
 if(!c||$("cardTierPanel"))return;
 const p=document.createElement("div");p.id="cardTierPanel";p.className="card-tier-panel";
 p.innerHTML='<div class="section-label">Card Tier</div><p class="hint">Basic: essential content. Premium: adds Profile Type and premium content. Elite: every content module.</p><div class="card-tier-grid">'+
  [["basic","🔹","Basic","Location, Education, Skills, Business Inquiry."],["premium","✨","Premium","Basic plus Profile Type and premium content."],["gold","👑","Elite","All content modules."]]
  .map(x=>'<label class="card-tier-option"><input type="radio" name="card_tier" value="'+x[0]+'"><span><b>'+x[1]+' '+x[2]+'</b><small>'+x[3]+'</small></span></label>').join("")+'</div>';
 const h2=c.querySelector("h2");h2.textContent="Card Tier & Profile Type";
 const hint=c.querySelector(":scope > .hint");if(hint)hint.textContent="Profile Type only sets the recommended defaults. You can still turn any content on or off.";
 h2.after(p);
 p.querySelectorAll('input[name="card_tier"]').forEach(el=>el.addEventListener("change",()=>{legacyCardTypeForSave=el.value;sync();dirty();}));
}

/* ---------- Content: Recommended (top) / Other (collapsed) ---------- */
function turnBtn(m){
 if(m.querySelector(".qi-turn"))return;
 const b=document.createElement("button");b.type="button";b.className="qi-turn";
 b.onclick=()=>{const s=sw(m);if(!s)return;s.checked=!s.checked;["input","change"].forEach(n=>s.dispatchEvent(new Event(n,{bubbles:true})));};
 const head=m.querySelector(".module-head"),s=head.querySelector(".switch");
 s?head.insertBefore(b,s):head.appendChild(b);
}
function search(e){
 const q=e.target.value.trim().toLowerCase();let n=0;
 mods().forEach(m=>{const ok=!q||m.textContent.toLowerCase().includes(q);m.classList.toggle("qi-search-hidden",!ok);if(ok&&!m.hidden)n++;});
 const h=card().querySelector(".nx-cg");
 if(q)h.querySelector('[data-g="other"]').classList.remove("is-collapsed");
 const em=h.querySelector(".qi-search-empty");em.textContent="No content module matches your search.";em.classList.toggle("is-visible",!!q&&!n);
}
function build(){
 const c=card();if(!c)return;
 let h=c.querySelector(".nx-cg");
 if(!h){
  h=document.createElement("div");h.className="nx-cg";
  h.innerHTML='<div class="qi-content-toolbar"><div class="qi-content-toolbar-copy"><b>Content</b><span id="nxCgSummary"></span></div><label class="qi-content-search"><input type="search" placeholder="Find a content module…" aria-label="Find a content module"></label></div><div class="qi-search-empty"></div>'+
   ["rec","other"].map(k=>'<section class="qi-category" data-g="'+k+'"><button type="button" class="qi-category-head"><span class="qi-category-title"><span class="qi-category-icon">'+(k==="rec"?"✨":"📦")+'</span><span><strong></strong><span class="nx-sub"></span></span></span><span class="qi-category-meta"><span class="qi-category-count"></span><span class="qi-category-chevron">⌄</span></span></button><div class="qi-category-body"></div></section>').join("");
  (c.querySelector("#adminProfileModules")||c.querySelector(".toggle-row")).after(h);
  h.querySelector('[data-g="other"]').classList.add("is-collapsed");
  h.querySelectorAll(".qi-category-head").forEach(b=>b.onclick=()=>b.parentNode.classList.toggle("is-collapsed"));
  h.querySelector("input").oninput=search;
 }
 const r=rec(type()),t=tier(),body=g=>h.querySelector('[data-g="'+g+'"] .qi-category-body');
 mods().forEach(m=>{
  const k=keyOf(m),special=!m.dataset.quickModule;
  m.hidden=special?t<2:T(k)>t;
  m.classList.remove("tier-locked");
  turnBtn(m);
  body(r.has(k)?"rec":"other").appendChild(m); /* moves only; state and saved data are never touched */
 });
 refresh();
}
function refresh(){
 const h=card()&&card().querySelector(".nx-cg");if(!h)return;
 const r=rec(type()),n={rec:[0,0],other:[0,0]};
 mods().forEach(m=>{
  if(m.hidden)return;
  const s=sw(m),on=!!(s&&s.checked),g=r.has(keyOf(m))?"rec":"other";
  m.classList.toggle("is-off",!on);
  const b=m.querySelector(".qi-turn");if(b)b.textContent=on?"Turn Off":"Turn On";
  n[g][1]++;if(on)n[g][0]++;
 });
 const set=(g,title,sub)=>{const s=h.querySelector('[data-g="'+g+'"]');s.querySelector("strong").textContent=title;s.querySelector(".nx-sub").textContent=sub;s.querySelector(".qi-category-count").textContent=n[g][0]+" on / "+n[g][1];s.hidden=!n[g][1];};
 set("rec","Recommended for "+(NAMES[type()]||"this profile"),"Included in this Profile Type · ON by default");
 set("other","Other Content","Not in this Profile Type · OFF by default, turn on any you need");
 h.querySelector("#nxCgSummary").textContent=(n.rec[1]+n.other[1])+" contents · "+(n.rec[0]+n.other[0])+" on";
}
function sync(){
 tierUI();
 const t=tier(),g=document.querySelector(".card-type-grid"),off=t<2;
 if(g)g.hidden=off;const hp=$("cardTypeHelp");if(hp)hp.hidden=off;
 build();
}
/* Profile Type switch: modules the admin left at the default follow the new type;
   modules the admin changed by hand keep their ON/OFF. Nothing is deleted. */
function onType(){
 const old=rec(lastType||type()),nw=rec(type());
 mods().forEach(m=>{const s=sw(m),k=keyOf(m);if(s&&s.checked===old.has(k))s.checked=nw.has(k);});
 lastType=type();build();dirty();
}
document.addEventListener("change",e=>{
 if(e.target.matches('input[name="card_type"]'))onType();
 else if(e.target.matches(".module-head input[type=checkbox]")&&e.target.closest("#quickInfoCard"))refresh();
});
/* New client: recommended ON, everything else OFF */
window.nxApplyNewClientContentDefaults=function(){
 const r=rec(type());
 mods().forEach(m=>{const s=sw(m);if(s)s.checked=r.has(keyOf(m));});
 lastType=type();build();
};

/* ---------- Specialized modules (no more duplicates on re-render) ---------- */
const defs=[["media","🎥","Media"],["games","🎮","Games"],["streaming","📡","Streaming"],["discord","💬","Discord"],["tournament_history","🏆","Tournament History"],["gallery","🖼️","Gallery"],["interests","✨","Interests"],["custom_links","🔗","Custom Links"],["collaborations","🤝","Collaborations"]];
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
window.nxRenderAdminModules=function(raw,vis){
 const h=$("adminProfileModules");if(!h)return;
 card().querySelectorAll(".module[data-profile-types]").forEach(m=>m.remove());
 let d={},v={};
 try{d=typeof raw==="string"?JSON.parse(raw||"{}"):(raw||{});}catch(e){}
 try{v=typeof vis==="string"?JSON.parse(vis||"{}"):(vis||{});}catch(e){}
 h.insertAdjacentHTML("beforeend",defs.map(x=>'<div class="module" data-profile-types="all"><div class="module-head"><label><input type="checkbox" id="profile_module_visible_'+x[0]+'" '+(v[x[0]]!==false?"checked":"")+'> Show in Client Dashboard</label><strong>'+x[1]+' '+x[2]+'</strong></div><textarea id="profile_module_'+x[0]+'" class="compact-textarea" placeholder="Add '+x[2].toLowerCase()+', one item per line...">'+esc(d[x[0]])+'</textarea></div>').join(""));
 h.querySelectorAll("textarea,input").forEach(el=>el.addEventListener("input",dirty));
 sync();
};
window.nxCollectAdminModules=()=>{const d={};defs.forEach(x=>{const e=$("profile_module_"+x[0]);if(e&&e.value.trim())d[x[0]]=e.value.trim();});return JSON.stringify(d);};
window.nxCollectAdminModuleVisibility=()=>{const d={};defs.forEach(x=>{const e=$("profile_module_visible_"+x[0]);if(e)d[x[0]]=e.checked;});return JSON.stringify(d);};
window.nextapBuildContentCategories=build;
window.nxRefreshAdminModuleType=build;
window.nxSetAdminCardTier=setTier;
window.nxApplyAdminTierAccess=sync;

/* ---------- List builders (fixed newline regex, re-render on load/clear) ---------- */
const B={services:["Add service","Web Design"],products:["Add product","Product A · ₱499"],reviews:["Add review","Great service and fast response!"],pricing:["Add package / rate","Basic Package · ₱999"],team:["Add team member","Juan · Manager"],business_inquiry:["Add inquiry option","Book a consultation"]};
const builders={};
function makeBuilder(k){
 const a=$(k);if(!a||builders[k])return;
 const w=document.createElement("div");w.className="content-builder";
 w.innerHTML='<div class="content-builder-head"><span>One item per row.</span><button type="button" class="content-builder-add">+ '+B[k][0]+'</button></div><div class="content-builder-list"></div>';
 a.hidden=true;a.after(w);
 const list=w.querySelector(".content-builder-list");
 const vals=()=>String(a.value||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const push=()=>{a.value=[...list.querySelectorAll("input")].map(i=>i.value.trim()).filter(Boolean).join("\n");a.dispatchEvent(new Event("input",{bubbles:true}));};
 const render=items=>{
  list.innerHTML="";
  if(!items.length){list.innerHTML='<div class="content-builder-empty">No items yet.</div>';return;}
  items.forEach(v=>{
   const r=document.createElement("div");r.className="content-builder-row";
   const i=document.createElement("input");i.type="text";i.value=v;i.placeholder=B[k][1];i.oninput=push;
   const x=document.createElement("button");x.type="button";x.className="content-builder-remove";x.textContent="×";x.setAttribute("aria-label","Remove item");
   x.onclick=()=>{r.remove();if(!list.querySelector("input"))render([]);push();};
   r.append(i,x);list.appendChild(r);
  });
 };
 w.querySelector(".content-builder-add").onclick=()=>{const cur=vals();cur.push("");render(cur);const ins=list.querySelectorAll("input");ins[ins.length-1].focus();};
 builders[k]=()=>render(vals());builders[k]();
}
const refreshBuilders=()=>Object.values(builders).forEach(f=>f());

/* ---------- Wrap load/clear so tier, builders and groups always match the record ---------- */
const _edit=window.editClient;
window.editClient=async id=>{await _edit(id);setTier(legacyCardTypeForSave);lastType=type();refreshBuilders();if(typeof updateQuickInfoPreviews==="function")updateQuickInfoPreviews();sync();};
const _clear=window.clearForm;
window.clearForm=function(){_clear();setTier("gold");refreshBuilders();sync();};

/* ---------- Business hours: day switch enables its time inputs ---------- */
["monday","tuesday","wednesday","thursday","friday","saturday","sunday"].forEach(d=>{
 const on=$("hours_"+d+"_enabled");if(!on)return;
 const write=()=>{$("business_hours").value=serializeBusinessHours();};
 on.addEventListener("change",()=>{["open","close"].forEach(s=>{const i=$("hours_"+d+"_"+s);if(i)i.disabled=!on.checked;});write();});
 ["open","close"].forEach(s=>$("hours_"+d+"_"+s)?.addEventListener("change",write));
});

/* ---------- Live previews while typing ---------- */
document.addEventListener("input",e=>{if(e.target.closest&&e.target.closest("#quickInfoCard")&&typeof updateQuickInfoPreviews==="function")updateQuickInfoPreviews();});

const run=()=>{Object.keys(B).forEach(makeBuilder);setTier(legacyCardTypeForSave);lastType=type();sync();};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run);else run();
})();
</script>
