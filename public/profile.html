<script>
const $=id=>document.getElementById(id),loading=$("loading"),error=$("error"),profile=$("profile"),
photo=$("photo"),fallback=$("photoFallback"),name=$("name"),role=$("role"),contacts=$("contacts"),
socials=$("socials"),socialCarousel=$("socialCarousel"),socialPrev=$("socialPrev"),socialNext=$("socialNext"),about=$("about"),aboutText=$("aboutText"),copyBtn=$("copyBtn"),contactBtn=$("contactBtn"),
shareBtn=$("shareBtn"),shareAction=$("shareAction"),qrBtn=$("qrBtn"),qrAction=$("qrAction"),themeBtn=$("themeBtn"),
qrModal=$("qrModal"),qrImage=$("qrImage"),qrLink=$("qrLink"),qrClose=$("qrClose"),messageBtn=$("messageBtn");
let client=null;
function showError(){loading.classList.add("hidden");profile.classList.add("hidden");error.classList.remove("hidden")}
function url(v){v=String(v||"").trim();if(!v)return"";return /^https?:\/\//i.test(v)?v:"https://"+v}
function socialUrl(v,t){
  v=String(v||"").trim();if(!v)return"";
  if(/^https?:\/\//i.test(v))return v;
  v=v.replace(/^@/,"");
  const bases={instagram:"https://instagram.com/",facebook:"https://facebook.com/",tiktok:"https://tiktok.com/@",linkedin:"https://linkedin.com/in/",youtube:"https://youtube.com/@",x:"https://x.com/",telegram:"https://t.me/",threads:"https://www.threads.net/@",github:"https://github.com/",behance:"https://behance.net/",dribbble:"https://dribbble.com/"};
  return (bases[t]||"")+v;
}
function brandImg(name, label){
  const src=`https://cdn.simpleicons.org/${name}/ffffff`;
  return `<img src="${src}" alt="${label||name}" aria-hidden="true" loading="eager">`;
}
function svg(type){const m={
phone:'<path fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round" d="M7.1 4.2 9.3 3.5l1.7 4.1-1.7 1.2a12.3 12.3 0 0 0 5.9 5.9l1.2-1.7 4.1 1.7-.7 2.2a2 2 0 0 1-2.1 1.4C11 17.4 6.6 13 5.7 6.3a2 2 0 0 1 1.4-2.1z"/>',
mail:'<rect x="3.2" y="5.2" width="17.6" height="13.6" rx="1.7" fill="none" stroke="currentColor" stroke-width="2.05"/><path d="m4.1 6.6 7.9 6 7.9-6" fill="none" stroke="currentColor" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round"/>',
web:'<circle cx="12" cy="12" r="8.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.2 12h17.6M12 3.2c2.2 2.5 3.3 5.4 3.3 8.8S14.2 18.3 12 20.8M12 3.2c-2.2 2.5-3.3 5.4-3.3 8.8S9.8 18.3 12 20.8" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/>',
whatsapp:brandImg('whatsapp','WhatsApp'),
telegram:brandImg('telegram','Telegram'),
viber:brandImg('viber','Viber')
};return `<svg viewBox="0 0 24 24" aria-hidden="true">${m[type]||m.web}</svg>`}
function addContact(label,sub,href,icon){if(!label||!href)return;const a=document.createElement("a");a.className="contact";a.href=href;if(icon==="web") {a.target="_blank";a.rel="noopener"} else a.target="_self";a.innerHTML=`<span class="icon ${icon}">${svg(icon)}</span><span class="divider"></span><span class="value"><span class="label"></span><span class="sub"></span></span><span class="contact-arrow"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span>`;a.querySelector(".label").textContent=label;a.querySelector(".sub").textContent=sub||label;contacts.appendChild(a)}
function socialUrl(v,t){
  v=String(v||"").trim(); if(!v)return"";
  if(/^https?:\/\//i.test(v))return v;
  v=v.replace(/^@/,"");
  const bases={
    instagram:"https://instagram.com/",
    facebook:"https://facebook.com/",
    linkedin:"https://linkedin.com/in/",
    tiktok:"https://tiktok.com/@",
    youtube:"https://youtube.com/@",
    x:"https://x.com/",
    twitter:"https://x.com/",
    threads:"https://threads.net/@",
    telegram:"https://t.me/",
    github:"https://github.com/",
    behance:"https://behance.net/",
    dribbble:"https://dribbble.com/"
  };
  return (bases[t]||"")+v;
}
function phoneDigits(v){return String(v||"").replace(/[^0-9+]/g,"").replace(/^\+/g,"")}
function socialIcon(type){
  const icons={
    facebook:'<span class="brand-circle facebook">'+brandImg('facebook','Facebook')+'</span>',
    instagram:'<span class="brand-circle instagram">'+brandImg('instagram','Instagram')+'</span>',
    tiktok:'<span class="brand-circle tiktok">'+brandImg('tiktok','TikTok')+'</span>',
    youtube:'<span class="brand-circle youtube">'+brandImg('youtube','YouTube')+'</span>',
    x:'<span class="brand-circle x">'+brandImg('x','X')+'</span>',
    linkedin:'<span class="brand-circle linkedin">'+brandImg('linkedin','LinkedIn')+'</span>',
    website:'<span class="brand-circle website"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M3.5 12h17M12 3.5c2.1 2.4 3.2 5.2 3.2 8.5S14.1 18.1 12 20.5M12 3.5C9.9 5.9 8.8 8.7 8.8 12s1.1 6.1 3.2 8.5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg></span>',
    threads:'<span class="brand-circle threads">'+brandImg('threads','Threads')+'</span>',
    github:'<span class="brand-circle github">'+brandImg('github','GitHub')+'</span>',
    behance:'<span class="brand-circle behance">'+brandImg('behance','Behance')+'</span>',
    dribbble:'<span class="brand-circle dribbble">'+brandImg('dribbble','Dribbble')+'</span>'
  }; return icons[type]||icons.website;
}
function addSocial(label,href,type){
  if(!href)return;
  const a=document.createElement("a");a.className="social "+type;a.href=href;a.target="_blank";a.rel="noopener";a.setAttribute("aria-label",label);a.innerHTML=socialIcon(type)+`<span>${label}</span>`;socials.appendChild(a);
}



function updateSocialCarousel(){
  if(!socials||!socialCarousel)return;
  const count=socials.children.length;
  socials.classList.remove("count-0","count-1","count-2","count-3","count-4plus");
  socials.classList.add(count===0?"count-0":count===1?"count-1":count===2?"count-2":count===3?"count-3":"count-4plus");
  const overflow=count>=4 && scrollWidthTooWide();
  socialCarousel.classList.toggle("is-overflow",overflow);
  socials.classList.toggle("is-overflow",overflow);
  if(!overflow){socialCarousel.classList.remove("at-start","at-end");return;}
  const max=Math.max(0,socials.scrollWidth-socials.clientWidth);
  const x=Math.max(0,Math.min(socials.scrollLeft,max));
  socialCarousel.classList.toggle("at-start",x<=2);
  socialCarousel.classList.toggle("at-end",x>=max-2);
}
function scrollWidthTooWide(){return socials.scrollWidth>socials.clientWidth+2;}
socials.addEventListener("scroll",updateSocialCarousel,{passive:true});
window.addEventListener("resize",()=>requestAnimationFrame(updateSocialCarousel));
socialPrev.addEventListener("click",()=>socials.scrollBy({left:-Math.max(180,socials.clientWidth*.72),behavior:"smooth"}));
socialNext.addEventListener("click",()=>socials.scrollBy({left:Math.max(180,socials.clientWidth*.72),behavior:"smooth"}));

function setAccent(v){const c=String(v||'').trim();if(/^#[0-9a-f]{6}$/i.test(c)){document.documentElement.style.setProperty('--accent',c);const n=parseInt(c.slice(1),16);const r=Math.min(255,((n>>16)&255)+48),g=Math.min(255,((n>>8)&255)+48),b=Math.min(255,(n&255)+48);document.documentElement.style.setProperty('--accent2',`rgb(${r},${g},${b})`)}}
function profileUrl(){return location.href}
async function shareProfile(){if(!client)return;const data={title:`${client.name||'NexTap'} — NexTap Digital Profile`,text:`Connect with ${client.name||'me'} on NexTap.`,url:profileUrl()};try{if(navigator.share){await navigator.share(data);return}}catch(e){if(e&&e.name==='AbortError')return}try{await navigator.clipboard.writeText(profileUrl());const spans=[shareAction&&shareAction.querySelector('span'),shareBtn];if(spans[0]){const old=spans[0].textContent;spans[0].textContent='Link Copied';setTimeout(()=>spans[0].textContent=old,1500)}}catch(e){prompt('Copy this profile link:',profileUrl())}}
function showQr(){if(!client)return;const u=encodeURIComponent(profileUrl());qrImage.src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=12&data='+u;qrLink.href=profileUrl();qrModal.classList.remove('hidden');document.body.style.overflow='hidden'}
function closeQr(){qrModal.classList.add('hidden');document.body.style.overflow=''}
function toggleTheme(){const dark=document.body.classList.toggle('dark-mode');localStorage.setItem('nextap-theme',dark?'dark':'light');themeBtn.innerHTML=dark?'<svg viewBox="0 0 24 24"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.6 8.6 0 1 0 20.5 15.5z"/></svg>':'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'}
shareBtn.onclick=shareProfile;if(shareAction)shareAction.onclick=shareProfile;qrBtn.onclick=showQr;if(qrAction)qrAction.onclick=showQr;qrClose.onclick=closeQr;qrModal.onclick=e=>{if(e.target===qrModal)closeQr()};themeBtn.onclick=toggleTheme;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeQr()});

async function load(){
 try{
  const parts=location.pathname.split("/").filter(Boolean);
  const querySlug=new URLSearchParams(location.search).get("slug");
  const slug=parts[0]==="profile"&&parts[1]?parts[1]:querySlug;
  if(!slug)return showError();
  const r=await fetch("/api/clients/"+encodeURIComponent(decodeURIComponent(slug)));const d=await r.json();
  if(!r.ok||!d)return showError();client=d;setAccent(d.accent_color);
  try{fetch("/api/clients/"+encodeURIComponent(d.id||d.slug)+"/view",{method:"POST",keepalive:true})}catch(e){}
  name.textContent=d.name||"";role.textContent=[d.job_title,d.company].filter(Boolean).join(" · ");
  contacts.innerHTML="";socials.innerHTML="";
  if(d.phone) addContact("Call",d.phone,"tel:"+d.phone,"phone");
  if(d.email) addContact("Email",d.email,"mailto:"+d.email,"mail");
  if(d.whatsapp) addContact("WhatsApp","Chat on WhatsApp","https://wa.me/"+phoneDigits(d.whatsapp).replace(/^0/,"63"),"whatsapp");
  if(d.viber) addContact("Viber","Message on Viber","viber://chat?number="+encodeURIComponent(d.viber),"viber");
  if(d.telegram) addContact("Telegram","Message on Telegram",socialUrl(d.telegram,"telegram"),"telegram");
  addSocial("Facebook",socialUrl(d.facebook,"facebook"),"facebook");
  addSocial("Instagram",socialUrl(d.instagram,"instagram"),"instagram");
  addSocial("Website",url(d.website),"website");
  addSocial("LinkedIn",socialUrl(d.linkedin,"linkedin"),"linkedin");
  addSocial("X",socialUrl(d.x||d.twitter,"x"),"x");
  addSocial("TikTok",socialUrl(d.tiktok,"tiktok"),"tiktok");
  addSocial("YouTube",socialUrl(d.youtube,"youtube"),"youtube");
  addSocial("Threads",socialUrl(d.threads,"threads"),"threads");
  addSocial("GitHub",socialUrl(d.github,"github"),"github");
  addSocial("Behance",socialUrl(d.behance,"behance"),"behance");
  addSocial("Dribbble",socialUrl(d.dribbble,"dribbble"),"dribbble");
  socials.classList.toggle("is-empty",!socials.children.length);
  socialCarousel.classList.toggle("is-empty",!socials.children.length);
  requestAnimationFrame(updateSocialCarousel);
  if(String(d.about||"").trim()){aboutText.textContent=d.about;about.classList.remove("hidden")}
  const im=d.photo_url||d.photo||"";
  if(im){photo.src=im;photo.classList.remove("hidden");fallback.classList.add("hidden");photo.onerror=()=>{photo.classList.add("hidden");fallback.textContent=(d.name||"N").charAt(0).toUpperCase();fallback.classList.remove("hidden")}}
  else{photo.classList.add("hidden");fallback.textContent=(d.name||"N").charAt(0).toUpperCase();fallback.classList.remove("hidden")}
  loading.classList.add("hidden");profile.classList.remove("hidden");
 }catch(e){showError()}
}
if(copyBtn)copyBtn.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);copyBtn.querySelector("span").textContent="Link Copied";setTimeout(()=>copyBtn.querySelector("span").textContent="Copy Profile Link",1600)}catch(e){prompt("Copy this profile link:",location.href)}};
messageBtn.onclick=()=>{if(!client||!client.phone)return;location.href="sms:"+client.phone};
contactBtn.onclick=()=>{if(!client)return;const v=["BEGIN:VCARD","VERSION:3.0","FN:"+(client.name||""),"ORG:"+(client.company||""),"TITLE:"+(client.job_title||""),client.phone?"TEL:"+client.phone:"",client.email?"EMAIL:"+client.email:"",client.website?"URL:"+client.website:"",client.whatsapp?"item1.X-ABLABEL:WhatsApp\nitem1.X-ABURI:https://wa.me/"+phoneDigits(client.whatsapp).replace(/^0/,"63"):"",client.messenger?"item3.X-ABLABEL:Messenger\nitem3.X-ABURI:"+((/^https?:\/\//i.test(String(client.messenger))?String(client.messenger):"https://m.me/"+String(client.messenger).replace(/^@/,""))):"",client.viber?"item2.X-ABLABEL:Viber\nitem2.X-ABURI:viber://chat?number="+encodeURIComponent(client.viber):"","END:VCARD"].filter(Boolean).join("\n");
const b=new Blob([v],{type:"text/vcard"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(client.slug||"contact")+".vcf";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
load();
</script>
