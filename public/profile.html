function addSocial(label,href,type){

function updateSocialCarousel(){
  if(!socials||!socialCarousel)return;
  const count=socials.children.length;
  socials.classList.remove("count-0","count-1","count-2","count-3","count-4plus");
  socials.classList.add(count===0?"count-0":count===1?"count-1":count===2?"count-2":count===3?"count-3":"count-4plus");
  const overflow=count>=4 && scrollWidthTooWide();
  socialCarousel.classList.toggle("is-overflow",overflow);
  socials.classList.toggle("is-overflow",overflow);
  if(!overflow){socialCarousel.classList.remove("at-start","at-end");return;}
  const max=Math.max(0,socials.scrollWidth-socials.clientWidth);
  const x=Math.max(0,Math.min(socials.scrollLeft,max));
  socialCarousel.classList.toggle("at-start",x<=2);
  socialCarousel.classList.toggle("at-end",x>=max-2);
}
function scrollWidthTooWide(){return socials.scrollWidth>socials.clientWidth+2;}
socials.addEventListener("scroll",updateSocialCarousel,{passive:true});
window.addEventListener("resize",()=>requestAnimationFrame(updateSocialCarousel));
socialPrev.addEventListener("click",()=>socials.scrollBy({left:-Math.max(180,socials.clientWidth*.72),behavior:"smooth"}));

function parseTimePart(v){
  if(v===null||v===undefined||v==='')return null;
  if(typeof v==='number'&&Number.isFinite(v)){
    const n=Math.round(v);
    return n>=0&&n<=1439?n:null;
  }
  const text=String(v).trim();
  if(/^\d+$/.test(text)){
    const n=Number(text);
    return Number.isFinite(n)&&n>=0&&n<=1439?n:null;
  }
  const m=text.match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?$/i);
  if(!m)return null;
  let h=Number(m[1]),min=Number(m[2]||0),ap=String(m[3]||'').toUpperCase();
  if(min>59)return null;
  if(ap){if(h<1||h>12)return null;if(ap==='AM'){if(h===12)h=0}else if(h!==12)h+=12}else if(h>23)return null;
  return h*60+min;
}

function dayIndex(name){const n=String(name||'').toLowerCase().replace(/[^a-z]/g,'');if(n==='sun'||n==='sunday')return 0;if(n==='mon'||n==='monday')return 1;if(n==='tue'||n==='tues'||n==='tuesday')return 2;if(n==='wed'||n==='wednesday')return 3;if(n==='thu'||n==='thur'||n==='thurs'||n==='thursday')return 4;if(n==='fri'||n==='friday')return 5;if(n==='sat'||n==='saturday')return 6;return -1}
function applyHourEntry(out,v,fallbackIndex){
  if(v==null)return;
  if(typeof v==='string'){const m=v.match(/(\d{1,2}(?::\d{2})?\s*(?:AM|PM)?)\s*(?:-|–|—|to)\s*(\d{1,2}(?::\d{2})?\s*(?:AM|PM)?)/i);if(m&&fallbackIndex>=0){out[fallbackIndex].enabled=true;out[fallbackIndex].open=parseTimePart(m[1]);out[fallbackIndex].close=parseTimePart(m[2])}return}
  const i=Number.isInteger(v.day)?v.day:fallbackIndex;if(i<0||i>6)return;if(v.enabled===false||v.closed===true){out[i].enabled=false;return}const a=parseTimePart(v.open||v.opening||v.start),b=parseTimePart(v.close||v.closing||v.end);if(a!=null&&b!=null){out[i].enabled=true;out[i].open=a;out[i].close=b}
}
function parseHoursText(raw){
  const out=Array.from({length:7},(_,i)=>({day:i,enabled:false,mode:'closed',periods:[]}));
  const text=String(raw||'').trim();
  if(!text)return out;

  const normalizePeriods=(periods)=>{
    if(!Array.isArray(periods))return [];
    return periods.map(p=>{
      const a=parseTimePart(p?.open??p?.opening??p?.start);
      const b=parseTimePart(p?.close??p?.closing??p?.end);
      return a!=null&&b!=null?{open:a,close:b}:null;
    }).filter(Boolean);
  };

  const applyV2=(x,i)=>{
    if(x&&typeof x==='object'&&Number.isInteger(x.day))i=x.day;
    if(i<0||i>6||!x)return;
    if(typeof x==='string'){
      const match=x.match(/(\d{1,2}(?::\d{2})?\s*(?:AM|PM)?)\s*(?:-|–|—|to)\s*(\d{1,2}(?::\d{2})?\s*(?:AM|PM)?)/i);
      if(match){const a=parseTimePart(match[1]),b=parseTimePart(match[2]);if(a!=null&&b!=null)out[i]={day:i,enabled:true,mode:'regular',periods:[{open:a,close:b}]}}
      return;
    }
    if(typeof x!=='object')return;
    const mode=String(x.mode||'').toLowerCase();
    if(x.enabled===false||x.closed===true||mode==='closed'){
      out[i]={day:i,enabled:false,mode:'closed',periods:[]};
      return;
    }
    if(mode==='24h'||mode==='24/7'||x.all_day===true||x.allDay===true){
      out[i]={day:i,enabled:true,mode:'24h',periods:[]};
      return;
    }
    const periods=normalizePeriods(x.periods);
    if(periods.length){
      out[i]={day:i,enabled:true,mode:'regular',periods};
      return;
    }
    const a=parseTimePart(x.open??x.opening??x.start);
    const b=parseTimePart(x.close??x.closing??x.end);
    if(a!=null&&b!=null)out[i]={day:i,enabled:true,mode:'regular',periods:[{open:a,close:b}]};
  };

  try{
    const parsed=JSON.parse(text);
    const src=Array.isArray(parsed)?parsed:(parsed&&typeof parsed==='object'?(parsed.days||parsed.hours||parsed):null);
    if(src){
      if(Array.isArray(src))src.forEach((x,i)=>applyV2(x,i));
      else Object.entries(src).forEach(([k,v])=>applyV2(v,dayIndex(k)));
      if(out.some(x=>x.enabled||x.mode==='closed'&&String(src).trim()!==''))return out;
    }
  }catch(e){}

  // Legacy text fallback.
  text.split(/\r?\n|;/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
    const m=line.match(/^([A-Za-z]+(?:\s*(?:-|to)\s*[A-Za-z]+)?)\s*(?:—|–|−|-|:)\s*(.+)$/i);
    if(!m)return;
    const dayPart=m[1].trim(),timePart=m[2].trim();
    let indexes=[];
    const range=dayPart.match(/^([A-Za-z]+)\s*(?:-|to)\s*([A-Za-z]+)$/i);
    if(range){
      const a=dayIndex(range[1]),b=dayIndex(range[2]);
      if(a>=0&&b>=0){let i=a;while(true){indexes.push(i);if(i===b)break;i=(i+1)%7;if(indexes.length>7)break}}
    }else{
      const di=dayIndex(dayPart);if(di>=0)indexes=[di];
    }
    if(!indexes.length)return;
    const closed=/^(closed|off|unavailable|not available)$/i.test(timePart);
    const tm=timePart.match(/(\d{1,2}(?::\d{2})?\s*(?:AM|PM)?)\s*(?:-|–|—|to)\s*(\d{1,2}(?::\d{2})?\s*(?:AM|PM)?)/i);
    indexes.forEach(i=>{
      if(closed)out[i]={day:i,enabled:false,mode:'closed',periods:[]};
      else if(tm){
        const a=parseTimePart(tm[1]),b=parseTimePart(tm[2]);
        if(a!=null&&b!=null)out[i]={day:i,enabled:true,mode:'regular',periods:[{open:a,close:b}]};
      }
    });
  });
  return out;
}

function todayHours(d){
  const h=parseHoursText(d.business_hours),t=new Date(),i=t.getDay(),x=h[i];
  if(x?.enabled&&x.mode==='24h')return {h,today:'Open 24 hours',state:'open',periods:[]};

  const periods=x?.enabled&&x.mode!=='closed'&&Array.isArray(x.periods)?x.periods:[];
  const mins=t.getHours()*60+t.getMinutes();
  const isOpen=(a,b,m)=>b<=a?m>=a:(m>=a&&m<b);
  let openNow=periods.some(p=>isOpen(p.open,p.close,mins));

  // If yesterday has an overnight period (for example 10 PM–2 AM),
  // keep the profile open after midnight until that period ends.
  if(!openNow){
    const prev=h[(i+6)%7];
    if(prev?.enabled&&prev.mode!=='closed'&&prev.mode!=='24h'){
      const prevPeriods=Array.isArray(prev.periods)?prev.periods:[];
      openNow=prevPeriods.some(p=>p.close<=p.open&&mins<p.close);
    }
  }

  const label=periods.map(p=>formatMinutes(p.open)+' – '+formatMinutes(p.close)).join(' · ')||(openNow?'Open from yesterday’s hours':'Closed');
  return {h,today:label,state:openNow?'open':'closed',periods};
}
function normalizeList(v){
  const s=String(v||'').trim();
  if(s.startsWith('[')){
    try{
      const arr=JSON.parse(s);
      if(Array.isArray(arr)) return arr.map(x=>{
        if(typeof x==='string') return x;
        return String(x?.name||x?.title||x?.text||x?.method||x?.role||'').trim();
      }).filter(Boolean);
    }catch(e){}
  }
  return s.split(/\n|,/).map(x=>x.trim()).filter(Boolean);
}

function renderItemRows(card,raw,limit=4){
  card.dataset.contentRows=String(raw??'');
  const box=document.createElement('div');box.className='quick-items';
  let entries=parseStructuredList(raw);
  if(!entries){try{const value=JSON.parse(String(raw));if(value&&typeof value==='object'&&!Array.isArray(value))entries=[value]}catch(e){}}
  (entries||splitInfo(raw)).slice(0,limit).forEach(item=>{
    const row=document.createElement('div');row.className='quick-item';
    if(item&&typeof item==='object'){
      row.classList.add('quick-content-entry');
      const text=value=>['string','number'].includes(typeof value)?String(value).trim():'';
      const first=keys=>keys.map(key=>text(item[key])).find(Boolean)||'';
      const title=first(['name','title','school','institution','text','method','game','platform','channel','label']);
      const main=document.createElement('span');main.className='quick-item-main';main.textContent=title||'Details';row.appendChild(main);
      const details=[...new Set(['degree','course','issuer','level','role','price','amount','description','details','caption','text','bio','rank','username','handle','date','dates','start_date','end_date','year','validUntil','rating'].map(key=>text(item[key])).filter(value=>value&&value!==title))];
      if(details.length){const meta=document.createElement('span');meta.className='quick-item-meta';meta.textContent=details.join(' · ');row.appendChild(meta)}
      const href=toHref(first(['link','url','href','website','invite']));
      if(href){const link=document.createElement('a');link.className='quick-link';link.textContent='View details →';link.href=href;link.target='_blank';link.rel='noopener';row.appendChild(link)}
      box.appendChild(row);return;
    }
    const line=String(item??'');
    const parts=line.split(/\s+[—–-]\s+|\s*\|\s*/);
    const main=document.createElement('span');main.className='quick-item-main';main.textContent=parts[0]||line;row.appendChild(main);
    if(parts[1]){const meta=document.createElement('span');meta.className='quick-item-meta';meta.textContent=parts.slice(1).join(' — ');row.appendChild(meta)}
    box.appendChild(row);
  });
  card.appendChild(box);return box;
}

  };

  const profileType=String(d.profile_type||'').trim().toLowerCase();
  const normalizedProfileType=profileTypeMap[profileType]||profileType;
  let profileModules={};
  try{profileModules=typeof d.profile_modules==='string'?JSON.parse(d.profile_modules||'{}'):(d.profile_modules||{});}catch(e){profileModules={};}
  if(!profileModules||typeof profileModules!=='object'||Array.isArray(profileModules))profileModules={};
  let profileModuleVisibility={};
  try{profileModuleVisibility=typeof d.profile_module_visibility==='string'?JSON.parse(d.profile_module_visibility||'{}'):(d.profile_module_visibility||{});}catch(e){profileModuleVisibility={};}
  if(!profileModuleVisibility||typeof profileModuleVisibility!=='object'||Array.isArray(profileModuleVisibility))profileModuleVisibility={};
  const customModule=v=>{const value=profileModules[v];return(value&&typeof value==='object'?JSON.stringify(value):String(value??'')).trim()};
  const customModuleEnabled=v=>profileModuleVisibility[v]!==false;

  const blueprint=contentBlueprints[normalizedProfileType];

  /* Specialized Content is available to every profile type.
     It is controlled only by the Admin "Show in Client Dashboard" toggle. */
  const customLabels={
    media:'Media',
    games:'Games',
    streaming:'Streaming',
    discord:'Discord',
    tournament_history:'Tournament History',
    gallery:'Gallery',
    interests:'Interests',
    custom_links:'Custom Links',
    collaborations:'Collaborations'
  };
  const customIcons={
    media:'media',
    games:'games',
    streaming:'streaming',
    discord:'discord',
    tournament_history:'tournament_history',
    gallery:'gallery',
    interests:'interests',
    custom_links:'custom_links',
    collaborations:'collaborations'
  };
  const customOrder=[
    'media','games','streaming','discord','tournament_history',
    'gallery','interests','custom_links','collaborations'
  ];
  customOrder.forEach(key=>{
    const raw=customModule(key);
    if(!raw||profileModuleVisibility[key]===false)return;
    const card=quickCard(customIcons[key],customLabels[key],'Specialized');
    card.classList.add('specialized-card','specialized-'+key);
    renderItemRows(card,raw,8);
    quickTrack.appendChild(card);
  });

  // Every enabled Quick Info module is eligible for the public profile.
  // Profile type is used for ordering in the dashboard, not for hiding content.
  const displayOrder=finalOrder;

  displayOrder.forEach(
    key=>{
      const count=quickTrack.children.length;
      if(renderers[key])renderers[key]();
      if(['skills','pricing','products','promotions','team'].includes(key)&&quickTrack.children.length>count)quickTrack.lastElementChild.dataset.contentRows=valueOf(key);
    }
  );

  const cards=[...quickTrack.children];
  if(!cards.length)return;

  // Six compact cards per swipe page: 3 columns × 2 rows.
  // The existing renderer order is preserved row-by-row.
  const pages=[];
  for(let i=0;i<cards.length;i+=6){
    const page=document.createElement('div');
    page.className='quick-page';
    cards.slice(i,i+6).forEach(card=>page.appendChild(card));
    quickTrack.appendChild(page);
    pages.push(page);
  }

  pages.forEach((_,i)=>{
    const dot=document.createElement('span');
    dot.className='quick-dot'+(i===0?' active':'');
    quickDots.appendChild(dot);
  });

  quickDots.style.display=pages.length>1?'flex':'none';
  quickInfo.classList.remove('hidden');

}

function quickCardStep(){
 const page=quickTrack?.querySelector?.('.quick-page');
 if(!page)return 1;
 const styles=getComputedStyle(quickTrack);
 const gap=parseFloat(styles.columnGap||styles.gap)||0;
 return page.getBoundingClientRect().width+gap;
}
function updateQuickInfo(){if(!quickTrack||!quickTrack.children.length)return;const pages=[...quickTrack.querySelectorAll('.quick-page')],dots=[...quickDots.children],max=Math.max(0,quickTrack.scrollWidth-quickTrack.clientWidth),x=quickTrack.scrollLeft;quickPrev.disabled=x<=2;quickNext.disabled=x>=max-2;const idx=Math.min(pages.length-1,Math.max(0,Math.round(x/Math.max(1,quickCardStep()))));dots.forEach((d,i)=>d.classList.toggle("active",i===idx))}
quickTrack.addEventListener("scroll",updateQuickInfo,{passive:true});
const quickInfoModal=document.getElementById('quickInfoModal');
const quickInfoModalClose=document.getElementById('quickInfoModalClose');
const closeQuickInfoModal=()=>{
  if(!quickInfoModal)return;
  quickInfoModal.classList.add('hidden');
  quickInfoModal.setAttribute('aria-hidden','true');
  document.body.classList.remove('quick-info-modal-open');
  quickInfoReturnFocus?.setAttribute('aria-expanded','false');
  quickInfoReturnFocus?.focus();
  quickInfoReturnFocus=null;
};
quickInfoModalClose?.addEventListener('click',closeQuickInfoModal);
quickInfoModal?.querySelector('.quick-info-modal-backdrop')?.addEventListener('click',closeQuickInfoModal);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&quickInfoModal&&!quickInfoModal.classList.contains('hidden'))closeQuickInfoModal();
  if(e.key==='Tab'&&quickInfoModal&&!quickInfoModal.classList.contains('hidden')){
    const focusable=[...quickInfoModal.querySelectorAll('button,a[href],[tabindex="0"]')].filter(element=>element.getClientRects().length);
    const first=focusable[0],last=focusable[focusable.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}
  }
});quickPrev.addEventListener("click",()=>quickTrack.scrollBy({left:-Math.max(190,quickTrack.clientWidth*.72),behavior:"smooth"}));quickNext.addEventListener("click",()=>quickTrack.scrollBy({left:Math.max(190,quickTrack.clientWidth*.72),behavior:"smooth"}));window.addEventListener("resize",()=>requestAnimationFrame(updateQuickInfo));
async function load(){
 try{
  const parts=location.pathname.split("/").filter(Boolean);
  const querySlug=new URLSearchParams(location.search).get("slug");
  const slug=parts[0]==="profile"&&parts[1]?parts[1]:querySlug;
  if(!slug)return showError("Profile link is missing","Please check the profile URL and try again.");

  let r,d;
  try{
   r=await fetch("/api/clients/"+encodeURIComponent(decodeURIComponent(slug)));
  }catch(e){
   return showError("Unable to load profile","Please check your internet connection and try again.");
  }

  try{d=await r.json()}catch(e){
   return showError("Unable to load profile","The server returned an invalid response. Please try again in a moment.");
  }

  if(r.status===404){
   return showError("Profile not found","Please check the profile link.");
  }
  if(!r.ok){
   return showError("Unable to load profile","Please try again in a moment.");
  }
  if(!d){
   return showError("Unable to load profile","No profile data was returned. Please try again.");
  }

  client=d;
  try{setAccent(d.accent_color)}catch(e){}
  try{fetch("/api/clients/"+encodeURIComponent(d.id||d.slug)+"/view",{method:"POST",keepalive:true})}catch(e){}

  try{
   name.textContent=d.name||"";
   role.textContent=[d.job_title,d.company].filter(Boolean).join(" · ");
   const profileLocationText=String(d.location||"").trim();
   const profileLocation=document.getElementById("profileLocation");
   if(profileLocation){
     profileLocation.querySelector("span").textContent=profileLocationText;
     profileLocation.classList.toggle("hidden",!profileLocationText);
   }
   contacts.innerHTML="";socials.innerHTML="";
   if(d.phone)addContact("Call",d.phone,"tel:"+d.phone,"phone");
   if(d.email)addContact("Email",d.email,"mailto:"+d.email,"mail");
   if(d.messenger)addContact("Messenger","Message on Messenger",socialUrl(d.messenger,"messenger"),"messenger");
   if(d.whatsapp)addContact("WhatsApp","Chat on WhatsApp","https://wa.me/"+phoneDigits(d.whatsapp).replace(/^0/,"63"),"whatsapp");
   if(d.viber){const v=phoneDigits(d.viber);const intl=v.startsWith("+")?v:(v.startsWith("0")?"63"+v.slice(1):v);addContact("Viber","Message on Viber","viber://chat?number="+encodeURIComponent(intl),"viber");}
   if(d.telegram)addContact("Telegram","Message on Telegram",socialUrl(d.telegram,"telegram"),"telegram");
   addSocial("Facebook",socialUrl(d.facebook,"facebook"),"facebook");
   addSocial("Instagram",socialUrl(d.instagram,"instagram"),"instagram");
   addSocial("Website",url(d.website),"website");
   addSocial("LinkedIn",socialUrl(d.linkedin,"linkedin"),"linkedin");
   addSocial("X",socialUrl(d.x||d.twitter,"x"),"x");
   addSocial("TikTok",socialUrl(d.tiktok,"tiktok"),"tiktok");
   addSocial("YouTube",socialUrl(d.youtube,"youtube"),"youtube");
   addSocial("Threads",socialUrl(d.threads,"threads"),"threads");
   addSocial("GitHub",socialUrl(d.github,"github"),"github");
   addSocial("Behance",socialUrl(d.behance,"behance"),"behance");
   addSocial("Dribbble",socialUrl(d.dribbble,"dribbble"),"dribbble");
   addSocial("Twitch",socialUrl(d.twitch,"twitch"),"twitch");
   addSocial("Steam",socialUrl(d.steam,"steam"),"steam");
   socials.classList.toggle("is-empty",!socials.children.length);
   socialCarousel.classList.toggle("is-empty",!socials.children.length);
   requestAnimationFrame(updateSocialCarousel);
   about.classList.add("hidden");
   if(String(d.about||"").trim()){aboutText.textContent=d.about;about.classList.remove("hidden")}
   renderFeatured(d);
   renderQuickInfo(d);
   const im=d.photo_url||d.photo||"";
   if(im){photo.src=im;photo.classList.remove("hidden");fallback.classList.add("hidden");photo.onerror=()=>{photo.classList.add("hidden");fallback.textContent=(d.name||"N").charAt(0).toUpperCase();fallback.classList.remove("hidden")}}
   else{photo.removeAttribute("src");photo.classList.add("hidden");fallback.textContent=(d.name||"N").charAt(0).toUpperCase();fallback.classList.remove("hidden")}
   loading.classList.add("hidden");
   profile.classList.remove("hidden");
   requestAnimationFrame(()=>{updateQuickInfo();updateSocialCarousel()});
  }catch(e){
   console.error("Profile render error:",e);
   return showError("Something went wrong","The profile could not be displayed. Please try again.");
  }
 }catch(e){
  console.error("Profile load error:",e);
  showError("Unable to load profile","Please try again in a moment.");
 }
}

/* === NEXtap ACTIONS FUNCTIONALITY RESTORE === */
if(messageBtn){
  messageBtn.onclick=()=>{
    if(!client || !client.phone) return;
    location.href="sms:"+String(client.phone).trim();
  };
}

if(contactBtn){
  contactBtn.onclick=async()=>{
    if(!client) return;

    const esc=v=>String(v||"")
      .replace(/\\/g,"\\\\")
      .replace(/\r?\n/g,"\\n")
      .replace(/;/g,"\\;")
      .replace(/,/g,"\\,");

    const cleanPhone=v=>String(v||"").trim();

    const social=(label,v)=>{
      if(!v) return "";
      return "X-SOCIALPROFILE;TYPE="+label+":"+esc(socialUrl(v,label));
    };

    const lines=[
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:"+esc(client.name||""),
      "FN:"+esc(client.name||""),
      client.company?"ORG:"+esc(client.company):"",
      client.job_title?"TITLE:"+esc(client.job_title):"",
      client.phone?"TEL;TYPE=CELL:"+esc(cleanPhone(client.phone)):"",
      client.email?"EMAIL;TYPE=INTERNET:"+esc(client.email):"",
      client.website?"URL:"+esc(url(client.website)):"",
      social("instagram",client.instagram),
      social("facebook",client.facebook),
      social("linkedin",client.linkedin),
      social("tiktok",client.tiktok),
      social("youtube",client.youtube),
      social("x",client.x||client.twitter),
      social("telegram",client.telegram),
      social("threads",client.threads),
      social("github",client.github),
      social("behance",client.behance),
      social("dribbble",client.dribbble),
      client.whatsapp?"X-SOCIALPROFILE;TYPE=whatsapp:"+esc(socialUrl(client.whatsapp,"whatsapp")):"",
      client.messenger?"X-SOCIALPROFILE;TYPE=messenger:"+esc(socialUrl(client.messenger,"messenger")):"",
      client.viber?"X-SOCIALPROFILE;TYPE=viber:"+esc(socialUrl(client.viber,"viber")):"",
      "END:VCARD"
    ].filter(Boolean).join("\r\n")+"\r\n";

    const fileName=(client.slug||"contact").replace(/[^a-z0-9_-]/gi,"_")+".vcf";
    const file=new File([lines],fileName,{type:"text/vcard;charset=utf-8"});

    /* iPhone/iPad: use the native share sheet when file sharing is supported. */
    try{
      if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({
          title:client.name||"Contact",
          files:[file]
        });
        return;
      }
    }catch(e){
      if(e && e.name==="AbortError") return;
    }

    /* Android/desktop fallback: download a standard vCard file. */
    const a=document.createElement("a");
    const objectUrl=URL.createObjectURL(file);
    a.href=objectUrl;
    a.download=fileName;
    a.rel="noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(objectUrl),3000);

    if(shareToast){
      shareToast.textContent="Contact file downloaded";
      shareToast.classList.add("show");
      clearTimeout(window.__contactToastTimer);
      window.__contactToastTimer=setTimeout(
        ()=>shareToast.classList.remove("show"),1800
      );
    }
  };
}


/* === NEXtap LONG NAME FIT — keep full names on one centered line === */
function fitProfileName(){
  const el=document.getElementById("name");
  if(!el || window.innerWidth>620) return;
  el.style.whiteSpace="nowrap";
  el.style.overflow="visible";
  el.style.textOverflow="clip";
  const maxSize=window.innerWidth<=390?25:31;
  const minSize=19;
  el.style.fontSize=maxSize+"px";
  let guard=40;
  while(guard-- > 0 && el.scrollWidth > el.clientWidth && parseFloat(getComputedStyle(el).fontSize)>minSize){
    el.style.fontSize=(parseFloat(getComputedStyle(el).fontSize)-0.5)+"px";
  }
}
window.addEventListener("resize",()=>requestAnimationFrame(fitProfileName));
