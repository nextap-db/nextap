name: Deploy NexTap to Cloudflare Workers
# Dashboard routing is Worker-first via wrangler.jsonc.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install


      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler deploy 2>&1 | tee wrangler-deploy.log
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # Wrangler can successfully upload an existing Worker and then fail
          # while reading account-level subdomain/membership metadata that an
          # Account API token cannot access. Treat only that exact post-deploy
          # case as successful; all other deployment failures still fail CI.
          if grep -q "Uploaded nextap" wrangler-deploy.log             && grep -Eq "/workers/subdomain|/memberships" wrangler-deploy.log             && grep -Eq "code: 10000|code: 9106" wrangler-deploy.log; then
            echo "::warning::Worker uploaded successfully; Wrangler failed only on post-deploy account metadata checks."
            exit 0
          fi

          exit "$status"
