name: Check and deploy NexTap to Cloudflare Workers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript and regression tests
        run: npm test
      - name: Verify Worker bundle
        run: npx --no-install wrangler deploy --dry-run --outdir work/worker-bundle

  deploy:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: nextap-production-deployment
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXTAP_DEPLOY_URL: ${{ vars.NEXTAP_DEPLOY_URL || secrets.NEXTAP_DEPLOY_URL || 'https://nextap.digitalprofile.workers.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate deployment configuration before changing D1 or Worker
        env:
          WORKER_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$WORKER_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$D1_TOKEN" || { echo "Missing CLOUDFLARE_D1_API_TOKEN"; exit 1; }
          node scripts/verify-deployment.mjs --check-config
      - name: Install dependencies
        run: npm ci
      - name: Verify recovery checkpoint and privately stage production data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/stage-release.mjs
      - name: Reconcile and verify additive D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: node scripts/reconcile-d1.mjs --remote --apply
      - name: Deploy Worker with the exact source commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          BUILD_DEFINE="BUILD_COMMIT:$(node -p 'JSON.stringify(process.env.GITHUB_SHA)')"
          npx --no-install wrangler deploy --define "$BUILD_DEFINE"
      - name: Confirm the deployed commit serves traffic
        run: node scripts/verify-deployment.mjs
